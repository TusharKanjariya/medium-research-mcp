<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in - Substack</title>
  </head>
  <body>
    <main>
      <h1>Sign in to continue</h1>
      <p>This publication's archive requires you to sign in.</p>
      <form action="/api/v1/login" method="post">
        <input type="email" name="email" placeholder="you@example.com" />
        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
